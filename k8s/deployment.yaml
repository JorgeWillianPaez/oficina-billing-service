apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-billing-service
  labels:
    app: oficina-billing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-billing-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: oficina-billing-service
    spec:
      containers:
        - name: app
          image: ${IMAGE}
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: oficina-billing-service
            - secretRef:
                name: oficina-billing-service
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 20
